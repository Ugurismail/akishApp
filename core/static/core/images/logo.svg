<svg viewBox="0 0 100 40" width="100" height="40" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Prussian Blue color -->
  <defs>
    <style>
      .prussian-blue { fill: #003153; stroke: none; font-size: 30px; font-family: Arial, sans-serif; }
      .text-style { fill: #003153; font-size: 30px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <!-- Interrobang Symbol -->
  <text x="5" y="30" class="prussian-blue">&#8253;</text>

